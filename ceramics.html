<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sculptures | Daniella Husam</title><meta name="description" content="Ceramic works and explorations in clay."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="assets/css/style.css" rel="stylesheet"></head><body data-category="Ceramics">
<header class="site-header">

<img class="mushroom-mark" src="assets/images/mushroom-logo.png" alt="">

<a class="mostra-nav-link" href="https://getmostra.com/artist/daniellahussam" target="_blank" rel="noopener noreferrer" aria-label="Visit Mostra"><img src="assets/images/mostra-logo.png" alt="Mostra"></a>
</nav></header>
<main class="gallery-main"><section class="card-grid" id="artwork-grid" aria-label="Sculptures artwork"><p class="empty-message">Loading artworks...</p></section></main>
<footer class="site-footer"><span>© 2026 Daniella Husam</span><span>Artist · Working internationally</span></footer>
<div class="zoom-viewer" id="zoom-viewer" role="dialog" aria-modal="true" aria-label="Artwork image viewer"><button class="zoom-close" id="zoom-close" aria-label="Close viewer">&times;</button><div class="zoom-toolbar"><button id="zoom-out" aria-label="Zoom out">−</button><span class="zoom-level" id="zoom-level">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-reset" aria-label="Reset zoom">↺</button></div><div class="zoom-stage" id="zoom-stage"><img id="zoom-image" src="" alt=""></div><div class="zoom-hint">DRAG TO MOVE · SCROLL OR USE + / − TO ZOOM</div></div><script>
const OWNER="daniellahusam", REPO="daniella-hussam-portfolio", BRANCH="main";
const CATEGORY= document.body.dataset.category;
const IS_PROJECTS = CATEGORY==="Projects";
const grid=document.getElementById("artwork-grid");
const viewer=document.getElementById("zoom-viewer"), stage=document.getElementById("zoom-stage"), zoomImage=document.getElementById("zoom-image"), zoomLevel=document.getElementById("zoom-level");
let scale=1, x=0, y=0, dragging=false, sx=0, sy=0, px=0, py=0;
function field(md,key){const m=md.match(new RegExp("^"+key+":\\s*(.*)$","m"));return m?m[1].trim().replace(/^["']|["']$/g,""):"";}
function description(md){const m=md.match(/^description:\s*(?:[>|-]+\s*)?\n([\s\S]*?)(?=\n(?:image|title|category|year|medium|price):|\n---)/m);return m?m[1].split("\n").map(s=>s.replace(/^\s+/,"")).join(" ").replace(/\s+/g," ").trim():"";}
function parse(md){const d=description(md), link=(md.match(/https:\/\/getmostra\.com\/artwork\/[^\s"'<>]+/)||[])[0]||"";const size=(d.match(/Size:\s*([^\n.]+)/i)||[])[1]||field(md,"size");const price=field(md,"price")||(d.match(/Price:\s*([^\n]+)/i)||[])[1]||"";return {title:field(md,"title"),category:field(md,"category"),year:field(md,"year"),medium:field(md,"medium"),image:field(md,"image"),size:size.trim(),price:price.trim(),description:d,link};}
function openViewer(item){scale=1;x=0;y=0;zoomImage.src=item.image.startsWith("http")?item.image:"https://daniellahusam.github.io/daniella-hussam-portfolio"+item.image;zoomImage.alt=item.title;update();zoomLevel.textContent="100%";viewer.classList.add("open");document.body.classList.add("viewer-open");}
function closeViewer(){viewer.classList.remove("open");document.body.classList.remove("viewer-open");}
function update(){zoomImage.style.transform=`translate(${x}px,${y}px) scale(${scale})`;zoomLevel.textContent=Math.round(scale*100)+"%";}
function zoomBy(n){scale=Math.max(1,Math.min(5,scale+n));if(scale===1){x=0;y=0;}update();}
document.getElementById("zoom-close").onclick=closeViewer;document.getElementById("zoom-in").onclick=()=>zoomBy(.25);document.getElementById("zoom-out").onclick=()=>zoomBy(-.25);document.getElementById("zoom-reset").onclick=()=>{scale=1;x=0;y=0;update();};
viewer.addEventListener("click",e=>{if(e.target===viewer)closeViewer();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeViewer();if(e.key==="+"||e.key==="=")zoomBy(.25);if(e.key==="-")zoomBy(-.25);});
stage.addEventListener("wheel",e=>{e.preventDefault();zoomBy(e.deltaY<0?.15:-.15);},{passive:false});
stage.addEventListener("pointerdown",e=>{if(scale<=1)return;dragging=true;sx=e.clientX;sy=e.clientY;px=x;py=y;stage.classList.add("dragging");stage.setPointerCapture(e.pointerId);});
stage.addEventListener("pointermove",e=>{if(!dragging)return;x=px+e.clientX-sx;y=py+e.clientY-sy;update();});
stage.addEventListener("pointerup",()=>{dragging=false;stage.classList.remove("dragging");});
function card(item){const article=document.createElement("article");article.className="work-card";const visual=document.createElement("div");visual.className="visual";const img=document.createElement("img");img.src=item.image.startsWith("http")?item.image:"https://daniellahusam.github.io/daniella-hussam-portfolio"+item.image;img.alt=item.title;img.loading="lazy";img.addEventListener("click",()=>openViewer(item));visual.appendChild(img);const details=document.createElement("div");details.className="artwork-details";const line=document.createElement("div");line.className="artwork-line";const strong=document.createElement("strong");strong.textContent=item.title;line.append(strong,document.createTextNode([item.size,item.medium,item.year].filter(Boolean).map(v=>", "+v).join("")));details.appendChild(line);if(item.description){const description=document.createElement("p");description.className="artwork-description";description.textContent=item.description;details.appendChild(description);}if(item.price){const price=document.createElement("div");price.className="artwork-price";price.textContent="Price: "+item.price;details.appendChild(price);}if(item.link){const a=document.createElement("a");a.className="artwork-purchase";a.href=item.link;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Link to Mostra";details.appendChild(a);}article.append(visual,details);return article;}
async function load(){try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/artworks?ref=${BRANCH}`);if(!r.ok)throw Error("Artwork collection unavailable");const files=(await r.json()).filter(f=>f.name.endsWith(".md"));const docs=await Promise.all(files.map(async f=>{const r=await fetch(f.download_url);return r.ok?parse(await r.text()):null;}));const items=docs.filter(i=>i&&i.image&&(CATEGORY==="Projects"?["Projects","Installations"].includes(i.category):i.category===CATEGORY));grid.innerHTML="";if(!items.length){grid.innerHTML='<p class="empty-message">No artworks have been added to this section yet.</p>';return;}items.forEach(i=>grid.appendChild(card(i)));const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("is-visible");observer.unobserve(e.target);}}),{threshold:.08});grid.querySelectorAll(".work-card").forEach(c=>observer.observe(c));}catch(e){console.error(e);grid.innerHTML='<p class="empty-message">The artworks could not be loaded. Please refresh the page.</p>';}}
load();
</script></body></html>
