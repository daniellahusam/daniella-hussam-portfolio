<div class="zoom-viewer" id="zoom-viewer" role="dialog" aria-modal="true" aria-label="Artwork image viewer"><button class="zoom-close" id="zoom-close" aria-label="Close viewer">&times;</button><div class="zoom-toolbar"><button id="zoom-out" aria-label="Zoom out">−</button><span class="zoom-level" id="zoom-level">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-reset" aria-label="Reset zoom">↺</button></div><div class="zoom-stage" id="zoom-stage"><img id="zoom-image" src="" alt=""></div><div class="zoom-hint">DRAG TO MOVE · SCROLL OR USE + / − TO ZOOM</div></div><script>
const OWNER="daniellahusam", REPO="daniella-hussam-portfolio", BRANCH="main";
const CATEGORY= document.body.dataset.category;
const IS_PROJECTS = CATEGORY==="Projects";
const grid=document.getElementById("artwork-grid");
const viewer=document.getElementById("zoom-viewer"), stage=document.getElementById("zoom-stage"), zoomImage=document.getElementById("zoom-image"), zoomLevel=document.getElementById("zoom-level");
let scale=1, x=0, y=0, dragging=false, sx=0, sy=0, px=0, py=0;
function field(md,key){const m=md.match(new RegExp("^"+key+":\\s*(.*)$","m"));return m?m[1].trim().replace(/^["']|["']$/g,""):"";}
function description(md){
  const match=md.match(/^description:\s*(.*)$/im);
  if(!match)return "";
  const first=match[1].trim();
  if(first && !/^[>|][-+]?$/.test(first))return first.replace(/^["']|["']$/g,"").trim();
  const lines=md.slice(match.index+match[0].length).replace(/^\r?\n/,"").split(/\r?\n/);
  const collected=[];
  for(const line of lines){
    if(line.trim()===""){collected.push("");continue;}
    if(!/^\s/.test(line))break;
    collected.push(line.trim());
  }
  return collected.join(" ").replace(/\s+/g," ").trim();
}
function sortByYear(items){return items.sort((a,b)=>{const ay=parseInt(a.year,10)||0,by=parseInt(b.year,10)||0;return by-ay;});}
function latestYear(items){return items.reduce((max,item)=>Math.max(max,parseInt(item.year,10)||0),0);}
function parse(md){const d=description(md), link=(md.match(/https:\/\/getmostra\.com\/artwork\/[^\s"'<>]+/)||[])[0]||"";const size=(d.match(/Size:\s*([^\n.]+)/i)||[])[1]||field(md,"size");const price=field(md,"price")||(d.match(/Price:\s*([^\n]+)/i)||[])[1]||"";return {title:field(md,"title"),category:field(md,"category"),year:field(md,"year"),medium:field(md,"medium"),image:field(md,"image"),size:size.trim(),price:price.trim(),description:d,link};}
function openViewer(item){scale=1;x=0;y=0;zoomImage.src=imageUrl(item.image);zoomImage.alt=item.title;update();zoomLevel.textContent="100%";viewer.classList.add("open");document.body.classList.add("viewer-open");}
function closeViewer(){viewer.classList.remove("open");document.body.classList.remove("viewer-open");}
function update(){zoomImage.style.transform=`translate(${x}px,${y}px) scale(${scale})`;zoomLevel.textContent=Math.round(scale*100)+"%";}
function zoomBy(n){scale=Math.max(1,Math.min(5,scale+n));if(scale===1){x=0;y=0;}update();}
document.getElementById("zoom-close").onclick=closeViewer;document.getElementById("zoom-in").onclick=()=>zoomBy(.25);document.getElementById("zoom-out").onclick=()=>zoomBy(-.25);document.getElementById("zoom-reset").onclick=()=>{scale=1;x=0;y=0;update();};
viewer.addEventListener("click",e=>{if(e.target===viewer)closeViewer();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeViewer();if(e.key==="+"||e.key==="=")zoomBy(.25);if(e.key==="-")zoomBy(-.25);});
stage.addEventListener("wheel",e=>{e.preventDefault();zoomBy(e.deltaY<0?.15:-.15);},{passive:false});
stage.addEventListener("pointerdown",e=>{if(scale<=1)return;dragging=true;sx=e.clientX;sy=e.clientY;px=x;py=y;stage.classList.add("dragging");stage.setPointerCapture(e.pointerId);});
stage.addEventListener("pointermove",e=>{if(!dragging)return;x=px+e.clientX-sx;y=py+e.clientY-sy;update();});
stage.addEventListener("pointerup",()=>{dragging=false;stage.classList.remove("dragging");});
function card(item){const article=document.createElement("article");article.className="work-card";const visual=document.createElement("div");visual.className="visual";const img=document.createElement("img");img.src=imageUrl(item.image);img.alt=[item.title,item.medium,item.year,"by Daniella Husam"].filter(Boolean).join(", ");img.loading="lazy";img.addEventListener("click",()=>openViewer(item));visual.appendChild(img);const details=document.createElement("div");details.className="artwork-details";const line=document.createElement("div");line.className="artwork-line";const strong=document.createElement("strong");strong.textContent=item.title;line.append(strong,document.createTextNode([item.size,item.medium,item.year].filter(Boolean).map(v=>", "+v).join("")));details.appendChild(line);if(item.description){const description=document.createElement("p");description.className="artwork-description";description.textContent=item.description;details.appendChild(description);}if(item.price){const price=document.createElement("div");price.className="artwork-price";price.textContent="Price: "+item.price;details.appendChild(price);}if(item.link){const a=document.createElement("a");a.className="artwork-purchase";a.href=item.link;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Link to Mostra";details.appendChild(a);}article.append(visual,details);return article;}
function imageUrl(path){if(!path)return "";if(/^https?:\/\//i.test(path))return path;return new URL(path.replace(/^\/+/, ""), new URL(".", window.location.href)).href;}
function projectStatement(){const article=document.createElement("article");article.className="project-statement";article.innerHTML=`<h1>The Dark Side of the Sea</h1><p class="project-meta">2019 · Graduation Project</p><p>The naive child innocently believes in imaginary terrors like the monster in the closet and creatures under the bed, but are they make-believe?</p><p>Sexual harassment is theft of the child's innocence and a prey to the safety and love implanted in the child. For example, Dracula, which we consider a myth, is a child monster with two teeth which are used to drag out love, safety, and the child's innocence, to make him a dead soul with a body living his whole life wondering where he went wrong and how his childhood ended before it even begun.</p><p>The ocean represents human nature, or man, because the apparent or obvious side of human nature shares our moral values, but when we dive deeper into the human soul as our ocean diving, the chaotic, extraordinary dimensions that we dissemble and try to possess, and if we compare the darkness of the ocean to the savage organisms and the dangers of human nature, we find that we are all capable of doing things that we can't imagine are so strange and so out of the ordinary.</p><p>This is a tendency to try from the inside of the human mind to understand the extent of its ability and the limits of its will. If we look at the human being like other less developed beings,we are surprised by the amount of things that go according to our desires, we usually call something good as we wish And half of the things that we're going against that don't match our desires as bad, and within this intellectual framework, we can be sure that morality is the consequence of desires at its core.</p>`;return article;}
function tedxStatement(){const article=document.createElement("article");article.className="project-statement tedx-statement";article.innerHTML=`<h1>TEDx · University of Jordan</h1><p class="project-meta">Event installation · University of Jordan</p><p>Created for TEDx at the University of Jordan, this large-scale illuminated installation brings the event’s identity into conversation with its Jordanian setting. The iconic TEDx lettering was constructed from cardboard and wall putty, with fairy lights integrated throughout the forms to create a glowing, intricate surface.</p><p>The patterned textile-inspired surface is a deliberate reference to Arab culture, grounding the installation in the cultural context of the event’s host country. By bringing this visual language into the TEDx lettering, the work connects a globally recognised event identity with a sense of local identity and belonging. The illuminated patterns give the structure warmth and presence, transforming the lettering into a sculptural feature within the space.</p><p class="project-materials"><strong>Materials:</strong> Cardboard, wall putty, fairy lights</p>`;return article;}
function comfortStatement(){const article=document.createElement("article");article.className="project-statement comfort-statement";article.innerHTML=`<h1>Comfort Zone</h1><p class="project-meta">3-metre installation sculpture made of recycled materials<br>Exhibited at Ras Al Ain Gallery · Recycled Art Festival Symposium</p><p>We all have what's called a “comfort zone”.</p><p>The comfort zone is a logical or a psychological space where you feel comfortable. Everyone has a different line in the sand. Some will stay near the shore while others will swim in the deep.</p><p>However, if we cross our line in the sand and fight against our fear we all can grow.</p><p>Stand in the middle of this sculpture and think what your line in the sand is?</p>`;return article;}
function observeCards(root){const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("is-visible");observer.unobserve(e.target);}}),{threshold:.08});root.querySelectorAll(".work-card").forEach(c=>observer.observe(c));}
async function load(){try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/artworks?ref=${BRANCH}`);if(!r.ok)throw Error("Artwork collection unavailable");const files=(await r.json()).filter(f=>f.name.endsWith(".md"));const docs=await Promise.all(files.map(async f=>{const response=await fetch(f.download_url);return response.ok?parse(await response.text()):null;}));const items=sortByYear(docs.filter(i=>i&&i.image&&(CATEGORY==="Projects"?["Projects","Installations"].includes(i.category):i.category===CATEGORY)));const content=document.getElementById("projects-content");content.innerHTML="";if(!items.length){content.innerHTML='<p class="empty-message">No projects have been added to this section yet.</p>';return;}
if(CATEGORY==="Projects"){
const seaItems=sortByYear(items.filter(i=>/dark side of the sea/i.test(i.title)));
const comfortItems=sortByYear(items.filter(i=>/comfort zone/i.test(i.title)));
const tedxItems=sortByYear(items.filter(i=>/ted.?x/i.test(i.title)));
const otherItems=sortByYear(items.filter(i=>!/dark side of the sea/i.test(i.title)&&!/comfort zone/i.test(i.title)&&!/ted.?x/i.test(i.title)));
const sections=[];
function addProjectDivider(section){const divider=document.createElement("div");divider.className="project-divider";divider.setAttribute("aria-hidden","true");section.appendChild(divider);}
if(tedxItems.length){const feature=document.createElement("section");feature.className="tedx-project";feature.setAttribute("aria-label","TEDx University of Jordan installation");feature.style.display="grid";feature.style.gridTemplateColumns="minmax(0,1fr) minmax(0,1fr)";feature.style.direction="ltr";feature.style.alignItems="start";feature.style.columnGap="clamp(28px,4vw,64px)";feature.style.rowGap="28px";feature.append(card(tedxItems[0]),tedxStatement());sections.push({year:latestYear(tedxItems),element:feature});}
if(otherItems.length){const latest=document.createElement("section");latest.className="projects-new-work";latest.setAttribute("aria-label","Projects");otherItems.forEach(i=>latest.appendChild(card(i)));sections.push({year:latestYear(otherItems),element:latest});}
if(comfortItems.length){const feature=document.createElement("section");feature.className="comfort-project";feature.setAttribute("aria-label","Comfort Zone installation");feature.style.display="grid";feature.style.gridTemplateColumns="minmax(0,1fr) minmax(0,1.35fr)";feature.style.direction="ltr";feature.style.alignItems="stretch";feature.style.width="100%";feature.style.columnGap="clamp(28px,4vw,64px)";feature.style.rowGap="28px";feature.append(card(comfortItems[0]),comfortStatement());addProjectDivider(feature);sections.push({year:latestYear(comfortItems),element:feature});}
{const feature=document.createElement("section");feature.className="projects-layout";feature.setAttribute("aria-label","The Dark Side of the Sea graduation project");feature.style.display="grid";feature.style.gridTemplateColumns="minmax(0,0.8fr) minmax(0,1.5fr)";feature.style.direction="ltr";feature.style.alignItems="start";feature.style.columnGap="clamp(28px,4vw,64px)";feature.style.rowGap="28px";const statement=projectStatement();const paragraphs=statement.querySelectorAll(":scope > p:not(.project-meta)");const finalParagraph=paragraphs[paragraphs.length-1];const rightRail=document.createElement("div");rightRail.className="projects-right-rail";rightRail.style.gridColumn="2";rightRail.style.gridRow="1";rightRail.style.minWidth="0";const gallery=document.createElement("div");gallery.className="projects-gallery";gallery.setAttribute("aria-label","The Dark Side of the Sea installation photograph");gallery.style.width="100%";gallery.style.minWidth="0";gallery.style.display="block";gallery.style.padding="0";gallery.style.margin="0";const composite=document.createElement("img");composite.src="assets/images/Installation pieces contain drawers, dolphin's fluke, toy box, bed hanging from the roof filled with childish drawings of fears and lost dreams. This project disc.png";composite.alt="The Dark Side of the Sea installation, showing Drawers of Secrets, Robbed Childhood and Bed of Nightmares together";composite.loading="lazy";composite.style.display="block";composite.style.width="100%";composite.style.height="auto";composite.style.maxWidth="100%";composite.style.objectFit="contain";composite.style.cursor="zoom-in";composite.addEventListener("click",()=>openViewer({image:composite.getAttribute("src"),title:composite.alt}));gallery.appendChild(composite);rightRail.appendChild(gallery);if(finalParagraph){finalParagraph.classList.add("project-final-paragraph");rightRail.appendChild(finalParagraph);}statement.style.gridColumn="1";statement.style.gridRow="1";feature.append(statement,rightRail);addProjectDivider(feature);sections.push({year:2020,element:feature});}
sections.sort((a,b)=>b.year-a.year).forEach(section=>{content.appendChild(section.element);observeCards(section.element);});
}
}catch(e){console.error(e);const content=document.getElementById("projects-content")||grid;content.innerHTML='<p class="empty-message">The artworks could not be loaded. Please refresh the page.</p>';}}
load();
</script></body></html>
