
media:
  input: assets/images
  output: /assets/images
  rename: safe
  categories: [image]

content:
  - name: artworks
    label: Artwork
    type: collection
    path: artworks
    fields:
      - name: title
        label: Artwork title
        type: string
      - name: category
        label: Category
        type: select
        options:
          values:
            - Selected Works
            - Studies
            - Ceramics
            - Projects
            - Installations
      - name: year
        label: Year
        type: string
      - name: medium
        label: Medium
        type: string
      - name: size
        label: Size
        type: string
      - name: price
        label: Price
        type: string
      - name: description
        label: Description
        type: text
      - name: image
        label: Artwork image
        type: image

  - name: achievements
    label: Outside the Studio
    type: file
    path: content/achievements.json
    format: json
    fields:
      - name: year
        label: Timeline year
        type: string
      - name: entries
        label: Exhibitions and features
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} · {type}"
        fields:
          - name: day_label
            label: Date emphasis (e.g. 20 or April)
            type: string
          - name: date_label
            label: Date
            type: string
          - name: date
            label: Date value (YYYY-MM-DD)
            type: string
          - name: type
            label: Category
            type: string
          - name: title
            label: Title or location
            type: string
          - name: venue
            label: Venue or publication
            type: string
          - name: description
            label: Short description
            type: text
          - name: upcoming
            label: Upcoming event
            type: boolean
      - name: closing_note
        label: Closing note
        type: text

  - name: homepage
    label: Home Page
    type: file
    path: content/home.json
    format: json
    fields:
      - name: introduction
        label: Homepage introduction
        type: text
      - name: featured_image
        label: Featured artwork photograph
        type: image
      - name: featured_alt
        label: Featured artwork description
        type: string
      - name: portfolio_heading
        label: Portfolio heading
        type: string
      - name: portfolio_description
        label: Portfolio description
        type: text
      - name: selected_works_image
        label: Selected Works photograph
        type: image
      - name: studies_image
        label: Studies photograph
        type: image
      - name: ceramics_image
        label: Ceramics photograph
        type: image
