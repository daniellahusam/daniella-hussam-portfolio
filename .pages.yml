
media:
  input: assets/images
  output: /assets/images
  rename: safe
  categories: [image]

content:
  - name: artworks
    label: Artwork
    type: collection
    path: artworks
    fields:
      - name: title
        label: Artwork title
        type: string
      - name: category
        label: Category
        type: select
        options:
          values:
            - Selected Works
            - Studies
            - Ceramics
            - Projects
            - Installations
      - name: year
        label: Year
        type: string
      - name: medium
        label: Medium
        type: string
      - name: size
        label: Size
        type: string
      - name: price
        label: Price
        type: string
      - name: description
        label: Description
        type: text
      - name: image
        label: Artwork image
        type: image

  - name: achievements
    label: Outside the Studio
    type: file
    path: content/achievements.json
    format: json
    fields:
      - name: year
        label: Timeline year
        type: string
      - name: entries
        label: Exhibitions and features
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} · {type}"
        fields:
          - name: day_label
            label: Date emphasis (e.g. 20 or April)
            type: string
          - name: date_label
            label: Date
            type: string
          - name: date
            label: Date value (YYYY-MM-DD)
            type: string
          - name: type
            label: Category
            type: string
          - name: title
            label: Title or location
            type: string
          - name: venue
            label: Venue or publication
            type: string
          - name: description
            label: Short description
            type: text
          - name: preview_position
            label: Photo preview placement (all photos in this entry)
            type: select
            options:
              values:
                - 50% 50%
                - 50% 20%
                - 50% 80%
                - 20% 50%
                - 80% 50%
                - 25% 25%
                - 75% 25%
                - 25% 75%
                - 75% 75%
          - name: photos
            label: Photos (upload up to 10)
            type: image
            list: false
            options:
              multiple:
                max: 10
              unique: true
              extensions: [jpg, jpeg, png, webp, gif]
              path: assets/images/achievements
          - name: upcoming
            label: Upcoming event
            type: boolean
      - name: closing_note
        label: Closing note
        type: text

  - name: homepage
    label: Home Page
    type: file
    path: content/home.json
    format: json
    fields:
      - name: achievements_eyebrow
        label: Announcements eyebrow
        type: string
      - name: achievements_heading
        label: Announcements heading
        type: string
      - name: achievements_description
        label: Announcements introduction
        type: text
      - name: announcements
        label: Announcements and milestones
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} · {type}"
        fields:
          - name: type
            label: Category / label
            type: string
          - name: title
            label: Heading
            type: string
          - name: detail
            label: Supporting text
            type: string
          - name: date_label
            label: Date shown
            type: string
          - name: date
            label: Date value (YYYY-MM-DD, optional)
            type: string
          - name: link_label
            label: Link text (optional)
            type: string
          - name: link_url
            label: Link URL (optional)
            type: string
      - name: featured_heading
        label: Featured work heading
        type: string
      - name: featured_description
        label: Featured work introduction
        type: text
      - name: featured_work
        label: Featured artworks
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Artwork title
            type: string
          - name: medium
            label: Medium / year
            type: string
          - name: description
            label: Short description
            type: text
          - name: image
            label: Artwork image
            type: image
          - name: link_label
            label: Link text
            type: string
          - name: link_url
            label: Artwork or gallery URL
            type: string
      - name: selected_links_heading
        label: Selected links heading
        type: string
      - name: selected_links
        label: Selected links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Link title
            type: string
          - name: description
            label: Short description
            type: string
          - name: url
            label: Destination URL
            type: string
      - name: mostra_eyebrow
        label: Mostra section eyebrow
        type: string
      - name: mostra_heading
        label: Mostra heading
        type: string
      - name: mostra_description
        label: Mostra description
        type: text
      - name: mostra_button_label
        label: Mostra button text
        type: string
      - name: mostra_url
        label: Mostra profile URL
        type: string
